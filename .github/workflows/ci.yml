name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to match the environment docs/BASELINE_M1.md was measured on.
          python-version: "3.11"

      - name: Install
        # The ml extra (onnxruntime + tokenizers) is installed so the Stage 2
        # unit tests actually RUN rather than skipping. They need no trained
        # artifact -- the decoder, the guards and the fusion tiers are pure
        # functions of model output and are tested against synthetic logits --
        # so this stays a fast, GPU-free job.
        run: pip install -e ".[dev,ml]"

      - name: Unit tests
        run: python -m pytest -q

      - name: The default install must stay dependency-free
        # The `fast` mode's whole claim is that it needs nothing but the
        # stdlib. A stray `import numpy` at module scope in pii_master would
        # break that silently for every user who did not ask for the extra,
        # and no other test in this job would notice.
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install -q -e .
          /tmp/bare/bin/python -c "
          import pii_master
          report = pii_master.scan_text('SSN 123-45-6789 for the patient')
          assert report.label.name == 'PHI', report.label
          print('rules-only install OK:', report.label.name)
          "

      # NOT gated here: `pii-master eval --deep` and `pii-master bench --deep`.
      # Both need a 30 MB model bundle, which is gitignored and not published,
      # so this job cannot run them. They are a release-time check on a machine
      # that has the artifact, and their results are committed as prose in
      # docs/STAGE2_INTEGRATION.md rather than as a scores file nothing can
      # regenerate. The Stage 2 code that CI *can* gate -- the decoder, the
      # guards, the fusion tiers -- is unit-tested above against synthetic
      # logits, which is why those tests were written not to need the artifact.

      - name: Quality gate (frozen corpus, no regression allowed)
        run: |
          pii-master eval eval/corpus/frozen_v1.jsonl \
            --fail-under eval/corpus/frozen_v1.scores.json

      - name: Performance gate (5 ms per 10 KB document, p95)
        # Shared CI runners are noisy, so the budget here is the contract
        # (5 ms), not the measured local figure (~0.8 ms). A regression big
        # enough to cross 5 ms is real regardless of runner variance.
        run: pii-master bench --fail-over-budget

      - name: CLI smoke test (end-to-end, exit codes)
        run: |
          set -e
          printf 'Discharge summary. MRN: 4829471, DOB: 03/14/1985.\n' > /tmp/phi.txt
          printf 'The quarterly planning meeting moved rooms.\n' > /tmp/clean.txt
          test "$(pii-master scan /tmp/phi.txt | python -c 'import json,sys; print(json.load(sys.stdin)["files"][0]["label"])')" = PHI
          test "$(pii-master scan /tmp/clean.txt | python -c 'import json,sys; print(json.load(sys.stdin)["files"][0]["label"])')" = NONE
          pii-master scan /tmp/clean.txt --fail-on-detect > /dev/null
          if pii-master scan /tmp/phi.txt --fail-on-detect > /dev/null; then
            echo "--fail-on-detect should have exited non-zero"; exit 1
          fi
