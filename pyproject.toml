[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pii-master"
version = "0.3.1"
description = "Fast, CPU-friendly PII/PHI detection and document classification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Deliberately empty: Stage 1 is stdlib-only so the production container
# stays within its 1 CPU / 4 GB budget. See docs/DESIGN.md section 5.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Stage 2 serving (`scan --deep`). Two wheels, not a framework: onnxruntime
# runs the graph and tokenizers is the same Rust tokenizer transformers wraps.
# The DEFAULT install stays dependency-free and rules-only, which is what keeps
# the `fast` mode's 1-core/4 GB claim honest -- see docs/DESIGN.md section 5.
ml = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.24",
]
# Stage 2 distillation (docs/DISTILLATION_PLAN.md). Not a runtime dependency:
# the shipped scanner stays stdlib-only. Install torch from the CUDA index
# first if you are training on a GPU.
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "pyarrow>=15",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",
]

[project.scripts]
pii-master = "pii_master.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_master"]

[tool.pytest.ini_options]
testpaths = ["tests"]
